    min-height: 100vh;
    padding: 24px;
  }
  .card {

    border: 6px solid #0d5c3a;
    border-radius: 6px;
    max-width: 480px;
    width: 100%;
    padding: 36px 32px;

  }

  .status {
    font-size: 16px;
    font-weight: bold;
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 20px;
  }
  .status.valid { background: #e4f3ea; color: #0d5c3a; border: 1px solid #0d5c3a; }
  .status.invalid { background: #fbe9e9; color: #a12727; border: 1px solid #a12727; }
  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 15px; }
  table td { padding: 8px 4px; border-bottom: 1px solid #ddd; }
  table td:first-child { color: #555; width: 45%; }
  table td:last-child { color: #16231c; font-weight: bold; }
  .footer-note { margin-top: 22px; font-size: 12px; color: #777; font-style: italic; }
</style>
